# === YT Learner Backend Configuration ===

server.port=8080

# CORS — Chrome extension origin
ytlearner.cors.allowed-origins=chrome-extension://*,http://localhost:3000

# AI Provider — Google Gemini
ytlearner.ai.gemini.api-key=${GEMINI_API_KEY:your-gemini-api-key-here}
ytlearner.ai.gemini.model=gemini-1.5-flash
ytlearner.ai.gemini.base-url=https://generativelanguage.googleapis.com/v1beta/models

# YouTube Data API (for fetching transcripts / metadata as fallback)
ytlearner.youtube.api-key=${YOUTUBE_API_KEY:your-youtube-api-key-here}

# H2 Database (development)
spring.datasource.url=jdbc:h2:file:./ytlearner-db;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Logging
logging.level.com.ytlearner=DEBUG
logging.level.org.springframework.web=INFO
