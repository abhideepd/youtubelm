# === YT Learner Backend Configuration ===

server.port=8080

# CORS — Chrome extension origin
ytlearner.cors.allowed-origins=chrome-extension://*,http://localhost:3000

# AI Provider — "anthropic" or "openai"
ytlearner.ai.provider=anthropic

# Anthropic Claude API
ytlearner.ai.anthropic.api-key=${ANTHROPIC_API_KEY:your-anthropic-api-key-here}
ytlearner.ai.anthropic.model=claude-sonnet-4-20250514
ytlearner.ai.anthropic.base-url=https://api.anthropic.com/v1

# OpenAI (alternative)
ytlearner.ai.openai.api-key=${OPENAI_API_KEY:}
ytlearner.ai.openai.model=gpt-4o-mini
ytlearner.ai.openai.base-url=https://api.openai.com/v1

# YouTube Data API (for fetching transcripts / metadata as fallback)
ytlearner.youtube.api-key=${YOUTUBE_API_KEY:your-youtube-api-key-here}

# H2 Database (development)
spring.datasource.url=jdbc:h2:file:./ytlearner-db;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# For PostgreSQL production — comment out H2 block above and set:
# spring.datasource.url=jdbc:postgresql://localhost:5432/ytlearner
# spring.datasource.username=ytlearner
# spring.datasource.password=secret
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Logging
logging.level.com.ytlearner=DEBUG
logging.level.org.springframework.web=INFO
